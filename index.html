<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SSG Production Guide Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6f8;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: min(400px, calc(100% - 32px));
      background: white;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .subtitle {
      margin: 0 0 26px;
      color: #777;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 0 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      margin-bottom: 17px;
      border: 1px solid #d8dbe0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #555;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 13px;
      background: #111;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
      text-align: center;
      min-height: 20px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    .welcome {
      text-align: center;
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .welcome p {
      color: #666;
      margin-top: 6px;
    }
  </style>
</head>

<body>

  <div class="login-box" id="loginBox">

    <h1>SSG Production Guide Builder</h1>
    <p class="subtitle">Sign in to continue</p>

    <form id="loginForm">

      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Sign In
      </button>

    </form>

    <div id="message"></div>

  </div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbz283z5h0bYhfG6sK615Oj6Kx1VO3LnKP6sYp5YwFB0-FnwioemeCTfDXisETBckf8d/exec';


const form = document.getElementById('loginForm');
const button = document.getElementById('loginButton');
const message = document.getElementById('message');


form.addEventListener('submit', async function(event) {

  event.preventDefault();

  const username =
    document.getElementById('username').value.trim();

  const password =
    document.getElementById('password').value;

  if (!username || !password) {
    showMessage('Please enter your username and password.', 'error');
    return;
  }

  button.disabled = true;
  button.textContent = 'Signing in...';

  showMessage('Checking...', '');


  try {

    const url =
      API_URL +
      '?action=login' +
      '&username=' + encodeURIComponent(username) +
      '&password=' + encodeURIComponent(password);


    const response = await fetch(url, {
      method: 'GET',
      cache: 'no-store'
    });


    if (!response.ok) {
      throw new Error('Server returned HTTP ' + response.status);
    }


    const result = await response.json();


    if (result.ok) {

      showWelcome(result);

    } else {

      showMessage(
        result.message || 'Invalid username or password.',
        'error'
      );

      button.disabled = false;
      button.textContent = 'Sign In';
    }


  } catch (error) {

    console.error(error);

    showMessage(
      'Unable to connect to the Accounts server.',
      'error'
    );

    button.disabled = false;
    button.textContent = 'Sign In';
  }

});


function showMessage(text, type) {

  message.textContent = text;
  message.className = type;
}


function showWelcome(account) {

  document.getElementById('loginBox').innerHTML = `
    <div class="welcome">

      <h2>Welcome!</h2>

      <p>
        ${escapeHtml(account.name)}
      </p>

      <p>
        Role: ${escapeHtml(account.role)}
      </p>

      <div
        style="
          margin-top:20px;
          color:#16803c;
          font-size:14px;
        "
      >
        Login successful.
      </div>

    </div>
  `;
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

</script>

</body>
</html>
