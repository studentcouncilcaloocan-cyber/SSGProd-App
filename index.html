    if(String(g.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      const items=sequenceItems(g);
      $('displayContent').innerHTML=`<div class="display-title" style="color:#0878c8">${esc(g.title||'')}</div><div class="display-title" style="font-size:clamp(15px,1.5vw,24px);margin-top:-6px">${esc(g.eventDate||'')}</div><div class="display-title" style="font-size:clamp(15px,1.5vw,24px);margin-top:-6px">${esc(g.venue||'')}</div><div class="sequence-prompt-display">${items.map((it,ii)=>{const dh=formatSequenceDetailsHtml(it.participants,false).replaceAll('sequence-format-oncam','sequence-display-oncam').replaceAll('sequence-format-oncam-label','sequence-display-oncam-label').replaceAll('sequence-format-oncam-name','sequence-display-oncam-name').replaceAll('sequence-format-oncam-cont','sequence-display-oncam-cont').replaceAll('sequence-format-line','sequence-display-detail');const sh=formatSequenceScriptHtml(it.notes,false).replaceAll('sequence-script-marker','sequence-display-script-marker').replaceAll('sequence-action-script','sequence-display-action-script').replaceAll('sequence-text-name','sequence-display-text-name').replaceAll('sequence-text-cont','sequence-display-text-cont').replaceAll('sequence-format-line','sequence-display-detail');return `<div class="display-item sequence-display-item" data-item-id="${escAttr(it.id)}"><div class="sequence-display-take">[TAKE ${esc(it.number||String(ii))}]${it.startTime?' '+esc(it.startTime):''}</div>${it.title?`<div class="sequence-display-spec">** ${esc(it.title)}</div>`:''}${dh}${sh}</div>`;}).join('')}${items.length?'<div class="sequence-display-end">** END OF PROGRAM</div>':''}${g.title?`<div class="sequence-display-endnote">** END OF ${esc(g.title)}${g.eventDate?`<br>HERE (${esc(g.eventDate)})`:''} **</div>`:''}</div>`;
    }else{
      $('displayContent').innerHTML=`<div class="display-title">${esc(g.title)}</div>${(g.sections||[]).map((s,si)=>`<section class="display-section"><div class="display-section-title">${si+1}. ${esc(s.title)}</div>${s.startTime||s.endTime?`<div class="display-section-time">${esc(s.startTime||'—')} – ${esc(s.endTime||'—')}</div>`:''}${(s.items||[]).map((it,ii)=>`<div class="display-item" data-item-id="${escAttr(it.id)}"><div class="display-item-title">#${esc(it.number||String(ii+1))} ${esc(it.title)}</div><div class="display-item-time">TIME: ${esc(it.startTime||'—')} – ${esc(it.endTime||'—')}</div><div class="display-item-trt">TRT: ${esc(trtDisplay(it)||'—')}</div>${it.notes?`<div class="display-item-note">NOTE: ${esc(it.notes)}</div>`:''}</div>`).join('')}</section>`).join('')}`;
    }
    applyDisplayZoom(); if(displayState.activeItemId) setActiveDisplayItem(displayState.activeItemId);
  }
  function updateDisplayTarget(){ $('displayKey').textContent='KEYBOARD: '+displayState.target.toUpperCase(); }
  function setActiveDisplayItem(id){displayState.activeItemId=id;document.querySelectorAll('.display-item').forEach(el=>el.classList.toggle('active',el.dataset.itemId===id));const el=id?document.querySelector('.display-item[data-item-id="'+CSS.escape(id)+'"]'):null;if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
  function toggleDisplayScroll(){displayState.scrolling=!displayState.scrolling; if(displayState.scrolling)startDisplayScroll(); else stopDisplayScroll();}
  function startDisplayScroll(){stopDisplayScroll();const speedSteps=[0.15,0.35,0.65,1.1,1.8,2.8,4.2,6.2,8.5];const step=speedSteps[Math.max(1,Math.min(9,displayState.speed))-1];const loop=()=>{if(!displayState.scrolling)return;const area=$('displayContent');if(area){area.scrollTop+=step;}displayState.raf=requestAnimationFrame(loop)};displayState.raf=requestAnimationFrame(loop)}
  function stopDisplayScroll(){if(displayState.raf)cancelAnimationFrame(displayState.raf);displayState.raf=null}
  function applyDisplayZoom(){const el=document.querySelector('.display-scroll');if(el)el.style.zoom=(displayState.zoom/100);}
  function handleDisplayKey(key){
    if(key===' ')toggleDisplayScroll();
    else if(/^[1-9]$/.test(key)){displayState.speed=Number(key);if(displayState.scrolling)startDisplayScroll();}
    else if(key==='['){displayState.zoom=Math.min(400,displayState.zoom+10);applyDisplayZoom();}
    else if(key===']'){displayState.zoom=Math.max(50,displayState.zoom-10);applyDisplayZoom();}
  }
  function renderDisplayTimer(){
    const t=displayState.timer;
    if(!t||!t.visible){
      $('displayTimerSmall').textContent='TIMER';$('displayTimerName').textContent='No active timer';$('displayTimerClock').textContent='00:00:00';$('displayTimer').classList.remove('warn','overtime');$('displayOvertime').classList.remove('show');$('displayTimerSmall').style.color='';return;
    }
    if(t.mode==='sequence'){
      $('displayTimerSmall').textContent=t.scheduledTime||'—';
      $('displayTimerName').textContent='#'+(t.itemNumber||'')+' '+(t.title||'TAKE');
      $('displayTimerClock').textContent=t.actualClock||'--:--:--';
      $('displayTimer').classList.remove('warn');$('displayTimer').classList.toggle('overtime',t.status==='overtime');
      $('displayOvertime').textContent=t.status==='overtime'?('OVERTIME '+t.deltaLabel):t.status==='undertime'?('UNDERTIME '+t.deltaLabel):'';
      $('displayOvertime').classList.toggle('show',t.status==='overtime'||t.status==='undertime');
      $('displayOvertime').style.background=t.status==='undertime'?'#555':'#e51919';
      return;
    }
    $('displayTimerSmall').textContent='#'+t.itemNumber;$('displayTimerName').textContent=t.title||'Program Item';
    const remaining=Math.max(0,(t.plannedMs||0)-(t.elapsedMs||0));
    $('displayTimerClock').textContent=t.overtime?('+'+formatClock((t.elapsedMs||0)-(t.plannedMs||0))):formatClock(remaining);
    $('displayTimer').classList.toggle('warn',!!t.warn);$('displayTimer').classList.toggle('overtime',!!t.overtime);$('displayOvertime').textContent='OVERTIME';$('displayOvertime').classList.toggle('show',!!t.overtime);
  }

  /* CONTROL */
  const controlState={guide:null,target:'control',timers:{},activeId:'',interval:null};
  function initControl(){
    const token=getStoredAuth()?.token||'';
    if(!token){ document.body.innerHTML='<div class="auth-gate"><div class="auth-card"><div class="auth-brand">SSG PROGRAM GUIDE BUILDER<small>CONTROL LOCKED</small></div><p class="auth-sub">This control window requires an active signed-in session.</p></div></div>'; return; }
    openPresenterChannel();
    document.body.innerHTML=`<div class="control-shell"><div class="control-top"><div><h2>SSG PROGRAM GUIDE BUILDER — CONTROL / TIMER</h2><div id="controlTarget" class="control-target">0 → DISPLAY</div></div><div><button class="btn small" onclick="window.close()">Close</button></div></div><div id="controlList" class="control-list"><div class="card"><div style="font-size:12px;color:#68737e">Loading program...</div></div></div><div class="control-hint">Press 0 to switch between CONTROL and DISPLAY. When DISPLAY is selected, Space / 1–9 / [ / ] control the TV display from this window. START / PAUSE / END are mouse controls only.</div></div>`;
    window.addEventListener('message',e=>{const d=e.data||{};if(!d||d.ssgPresenter!==true)return;if(d.type==='guide'){controlState.guide=d.guide;prepareTimers();renderControl();}if(d.type==='targetState'){controlState.target=d.target;renderControlTarget();}});
    window.addEventListener('keydown',e=>{
      if(e.repeat)return;
      const key=(e.code==='Numpad0'||e.key==='0')?'0':(e.code==='Space'||e.key===' ')?' ':e.key;
      // 0 is the ONLY key that changes the active keyboard window.
      if(key==='0'){
        e.preventDefault();
        e.stopPropagation();
        requestPresenterTargetToggle(controlState.target,'control');
        return;
      }
      // When DISPLAY is the selected target, allow the tech to operate the
      // display from the control window without clicking the display window.
      // START / PAUSE / END are buttons only; they never move keyboard focus.
      if(controlState.target==='display' && (key===' '||key==='['||key===']'||/^[1-9]$/.test(key))){
        e.preventDefault();
        e.stopPropagation();
        sendPresenterCommand('displayKey',{key:key});
      }
    },{capture:true});
    window.addEventListener('beforeunload',()=>{try{window.opener?.postMessage({ssgPresenter:true,type:'controlClosed'},'*');}catch(err){} try{presenterChannel?.close();}catch(err){}});
    window.opener?.postMessage({ssgPresenter:true,type:'ready',mode:'control'},'*');
    if(APP_CONFIG.liveSession){ startLiveSessionPolling(); }

  }
  function sequenceClockNow(){
    const d=new Date();
    const h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
    return {seconds:h*3600+m*60+s,text:(h%12||12)+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'\n'+(h>=12?'PM':'AM')};
  }
  function sequenceTimeSeconds(v){return parseClockSeconds(v);}
  function sequenceStatus(t){
    const now=sequenceClockNow();const scheduled=sequenceTimeSeconds(t.scheduledTime);if(scheduled===null)return {status:'waiting',delta:0,label:''};
    let delta=now.seconds-scheduled;if(delta>43200)delta-=86400;if(delta<-43200)delta+=86400;
    if(delta>0)return {status:'overtime',delta:delta,label:'+'+formatClock(delta*1000)};
    if(delta<0)return {status:'undertime',delta:delta,label:'-'+formatClock(Math.abs(delta)*1000)};
    return {status:'on-time',delta:0,label:'ON TIME'};
  }
  function prepareTimers(){
    if(String(controlState.guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      const map={};sequenceItems(controlState.guide).forEach((it,idx)=>map[it.id]={itemId:it.id,itemNumber:it.number,title:it.title,scheduledTime:it.startTime,status:'idle',visible:idx===0,done:false});controlState.timers=map;clearInterval(controlState.interval);controlState.interval=setInterval(tickControl,500);tickControl();broadcastTimer();return;
    }
    const map={};(controlState.guide?.sections||[]).forEach(s=>(s.items||[]).forEach(it=>{if(!map[it.id])map[it.id]={itemId:it.id,itemNumber:it.number,title:it.title,plannedMs:(parseTrtSeconds(it.trt||it.duration||'')!==null ? parseTrtSeconds(it.trt||it.duration||'') : durationSeconds(it.startTime,it.endTime))*1000,elapsedMs:0,status:'idle',startedAt:0,visible:false};}));controlState.timers=map;clearInterval(controlState.interval);controlState.interval=setInterval(tickControl,200);tickControl();
  }
  function renderControlTarget(){ $('controlTarget').textContent='0 → '+(controlState.target==='control'?'DISPLAY':'CONTROL'); }
  function renderControl(){
    const g=controlState.guide;if(!g)return;
    if(String(g.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      $('controlList').innerHTML=sequenceItems(g).map((it,ii)=>`<div class="control-item" id="ctl-${escAttr(it.id)}"><div class="control-item-top"><div class="control-item-title">[TAKE ${esc(it.number||String(ii))}] ${esc(it.title)}</div><div id="ctimer-${escAttr(it.id)}" class="control-timer">--:--:--</div></div><div class="control-scheduled">SCHEDULED: ${esc(it.startTime||'—')}</div><div class="control-actions"><button class="start" onclick="startTimer('${escAttr(it.id)}')">START</button><button class="end" onclick="endTimer('${escAttr(it.id)}')">DONE</button></div><div id="cover-${escAttr(it.id)}" class="control-overtime">OVERTIME</div></div>`).join('');updateAllControlTimerViews();renderControlTarget();return;
    }
    $('controlList').innerHTML=(g.sections||[]).map((s,si)=>`<section class="control-section"><div class="control-section-head">${si+1}. ${esc(s.title)}<div class="control-section-time">${esc(s.startTime||'—')} – ${esc(s.endTime||'—')}</div></div>${(s.items||[]).map((it,ii)=>`<div class="control-item" id="ctl-${escAttr(it.id)}"><div class="control-item-top"><div class="control-item-title">#${esc(it.number||String(ii+1))} ${esc(it.title)}</div><div id="ctimer-${escAttr(it.id)}" class="control-timer">00:00:00</div></div><div class="control-actions"><button class="start" onclick="startTimer('${escAttr(it.id)}')">START</button><button class="pause" onclick="pauseTimer('${escAttr(it.id)}')">PAUSE</button><button class="end" onclick="endTimer('${escAttr(it.id)}')">END</button></div><div id="cover-${escAttr(it.id)}" class="control-overtime">OVERTIME</div></div>`).join('')}</section>`).join('');updateAllControlTimerViews();renderControlTarget();
  }
  function startTimer(id){
    const t=controlState.timers[id];if(!t)return;
    if(String(controlState.guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      if(controlState.activeId&&controlState.activeId!==id)pauseTimer(controlState.activeId);t.status='running';t.done=false;t.visible=true;controlState.activeId=id;activateControlRow(id);broadcastTimer();sendActiveItem(id);publishLiveState({guide:clone(controlState.guide),timer:timerPayload(t),activeItemId:id,target:controlState.target});updateAllControlTimerViews();return;
    }
    if(controlState.activeId&&controlState.activeId!==id)pauseTimer(controlState.activeId);if(t.status==='ended'){t.elapsedMs=0;}t.status='running';t.startedAt=Date.now()-t.elapsedMs;controlState.activeId=id;t.visible=true;activateControlRow(id);broadcastTimer();sendActiveItem(id);publishLiveState({guide:clone(controlState.guide),timer:timerPayload(t),activeItemId:id,target:controlState.target});updateAllControlTimerViews();
  }
  function pauseTimer(id){const t=controlState.timers[id];if(!t)return;if(String(controlState.guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE')return;if(t.status==='running'){t.elapsedMs=Date.now()-t.startedAt;t.status='paused';if(controlState.activeId===id)controlState.activeId='';broadcastTimer();publishLiveState({guide:clone(controlState.guide),timer:timerPayload(t),activeItemId:controlState.activeId,target:controlState.target});updateAllControlTimerViews();}}
  function endTimer(id){
    const t=controlState.timers[id];if(!t)return;
    if(String(controlState.guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){t.done=true;t.status='done';t.visible=true;if(controlState.activeId===id)controlState.activeId='';const list=sequenceItems(controlState.guide);const idx=list.findIndex(x=>String(x.id)===String(id));const next=idx>=0?list[idx+1]:null;if(next&&controlState.timers[next.id]){controlState.timers[next.id].visible=true;}broadcastTimer();updateAllControlTimerViews();return;}
    if(t.status==='running')t.elapsedMs=Date.now()-t.startedAt;t.status='ended';if(controlState.activeId===id)controlState.activeId='';t.visible=true;broadcastTimer();updateAllControlTimerViews();
  }
  function tickControl(){
    if(String(controlState.guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      const id=controlState.activeId;if(id){const t=controlState.timers[id];if(t&&t.status==='running'){updateControlTimerView(t);broadcastTimer();}}else{const vals=Object.values(controlState.timers);const current=vals.find(x=>x.visible&&!x.done);if(current){updateControlTimerView(current);broadcastTimer();}}return;
    }
    const id=controlState.activeId;if(id){const t=controlState.timers[id];if(t&&t.status==='running'){t.elapsedMs=Date.now()-t.startedAt;updateControlTimerView(t);broadcastTimer();}}
  }
  function updateControlTimerView(t){
    const clock=$('ctimer-'+t.itemId);if(!clock)return;
    if(String(controlState.guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      if(t.done){clock.textContent='DONE';clock.className='control-timer done';const box=$('cover-'+t.itemId);if(box)box.classList.remove('show');return;}
      const st=sequenceStatus(t);clock.textContent=sequenceClockNow().text;clock.classList.remove('warn','overtime');const box=$('cover-'+t.itemId);if(box){box.classList.toggle('show',st.status==='overtime'||st.status==='undertime');box.textContent=st.status==='overtime'?'OVERTIME '+st.label:st.status==='undertime'?'UNDERTIME '+st.label:'';box.style.background=st.status==='undertime'?'#555':'#e51919';}return;
    }
    const remaining=Math.max(0,(t.plannedMs||0)-(t.elapsedMs||0));clock.textContent=t.overtime?('+'+formatClock((t.elapsedMs||0)-(t.plannedMs||0))):formatClock(remaining);const warn=t.plannedMs>0&&remaining<=10000&&remaining>0;const over=t.plannedMs>0&&t.elapsedMs>=t.plannedMs;clock.classList.toggle('warn',warn);clock.classList.toggle('overtime',over);const box=$('cover-'+t.itemId);if(box)box.classList.toggle('show',over);
  }
  function updateAllControlTimerViews(){Object.values(controlState.timers).forEach(updateControlTimerView);}
  function activateControlRow(id){document.querySelectorAll('.control-item').forEach(el=>el.style.outline=el.id==='ctl-'+id?'2px solid #f3c400':'none');}
  function timerPayload(t){
    if(!t)return null;
    if(String(controlState.guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      const st=sequenceStatus(t);return {mode:'sequence',visible:!!t.visible,itemId:t.itemId,itemNumber:t.itemNumber,title:t.title,scheduledTime:t.scheduledTime,actualClock:sequenceClockNow().text,status:t.done?'done':st.status,deltaLabel:st.label};
    }
    const elapsed=t.status==='running'?Date.now()-t.startedAt:t.elapsedMs;const remaining=t.plannedMs>0?Math.max(0,t.plannedMs-elapsed):0;return {mode:'flow',visible:!!t.visible,itemId:t.itemId,itemNumber:t.itemNumber,title:t.title,elapsedMs:elapsed,plannedMs:t.plannedMs,warn:t.plannedMs>0&&remaining<=10000&&elapsed<t.plannedMs,overtime:t.plannedMs>0&&elapsed>=t.plannedMs};
  }
  function broadcastTimer(){const t=controlState.activeId?controlState.timers[controlState.activeId]:lastVisibleTimer();const payload=timerPayload(t);sendToPresenterMode('display','timerState',{payload:payload});}
  function lastVisibleTimer(){const vals=Object.values(controlState.timers).filter(t=>t.visible);return vals.length?vals[vals.length-1]:null;}
  function sendActiveItem(id){sendToPresenterMode('display','activeItem',{payload:{itemId:id}});}
  /* Simple client-only image export. */
  function downloadGuideImage(guide){
    const width=1400,pad=60,lineH=30;let lines=[guide.title||'TECH GUIDE',''];
    if(String(guide.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){sequenceItems(guide).forEach((it,ii)=>{lines.push('[TAKE '+(it.number||String(ii))+']'+(it.startTime?' '+it.startTime:''));if(it.title)lines.push('** '+it.title);if(it.participants)lines.push(it.participants);if(it.notes)lines.push(it.notes);});}else{(guide.sections||[]).forEach((s,si)=>{lines.push((si+1)+'. '+s.title);if(s.startTime||s.endTime)lines.push((s.startTime||'—')+' – '+(s.endTime||'—'));(s.items||[]).forEach((it,ii)=>{lines.push('#'+(it.number||String(ii+1))+' '+it.title);lines.push('TIME: '+(it.startTime||'—')+' – '+(it.endTime||'—')+'   TRT: '+(trtDisplay(it)||'—'));if(it.notes)lines.push('NOTE: '+it.notes);});lines.push('');});}
    const c=document.createElement('canvas');c.width=width;c.height=Math.max(500,lines.length*lineH+pad*2);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#073763';ctx.font='bold 30px Arial';ctx.fillText(guide.title||'TECH GUIDE',pad,60);ctx.fillStyle='#111';ctx.font='18px Arial';let y=105;lines.slice(1).forEach(line=>{ctx.fillText(line.substring(0,120),pad,y);y+=lineH;});const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=(guide.title||'tech-guide').replace(/[^a-z0-9-_ ]/gi,'-')+'.png';a.click();
  }

  // Initialize the correct window mode.
  init();
</script>
</body>
