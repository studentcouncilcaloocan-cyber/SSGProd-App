<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSG Program Guide Builder</title>
  <style>
    *{box-sizing:border-box}
    :root{--blue:#073763;--blue2:#0b4d87;--yellow:#f3c400;--bg:#f5f7fa;--line:#d9e0e7;--text:#17202a;--muted:#66717e;--red:#d71920;--green:#17823b}
    html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .app{display:flex;min-height:100vh}
    .sidebar{width:245px;background:#fff;border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
    .brand{font-weight:800;color:var(--blue);font-size:17px;line-height:1.15}
    .brand small{display:block;color:var(--muted);font-size:10px;font-weight:700;margin-top:4px}
    .nav{display:flex;flex-direction:column;gap:7px}
    .nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:8px;color:#34404b;font-weight:700;font-size:13px}
    .nav button:hover,.nav button.active{background:#edf3f9;color:var(--blue)}
    .sidebar-foot{margin-top:auto;color:#8b96a2;font-size:10px;line-height:1.5}
    .main{flex:1;min-width:0}
    .topbar{padding:18px 22px;border-bottom:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;gap:14px;align-items:center}
    .topbar h1{margin:0;font-size:20px;color:var(--blue);font-family:Arial,Helvetica,sans-serif}
    .topbar p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .content{padding:20px;max-width:1500px;margin:0 auto}
    .page{display:none}
    .page.active{display:block}
    .toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .toolbar-left,.toolbar-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .search,input,select,textarea{border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);outline:none}
    .search{min-width:260px;padding:10px 11px}
    input,select,textarea{width:100%;padding:10px 11px}
    textarea{min-height:88px;resize:vertical}
    input:focus,select:focus,textarea:focus,.search:focus{border-color:var(--blue2);box-shadow:0 0 0 2px rgba(7,55,99,.08)}
    .btn{border:1px solid var(--line);background:#fff;color:#27313a;border-radius:7px;padding:9px 12px;font-weight:700;font-size:12px}
    .btn:hover{background:#f3f6f8}
    .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .btn.primary:hover{background:var(--blue2)}
    .btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#111}
    .btn.danger{background:#fff5f5;color:var(--red);border-color:#f0c0c3}
    .btn.small{padding:6px 9px;font-size:11px}
    .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
    .guide-list{display:flex;flex-direction:column;gap:10px}
    .guide-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:13px;border-radius:9px;background:#fff}
    .guide-info{flex:1;min-width:0}.guide-title{font-weight:800;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.guide-meta{color:var(--muted);font-size:11px;margin-top:4px}
    .empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px;background:#fff}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:800;color:#4f5b67;margin-bottom:5px}
    .section-card{border:1px solid #cfd8e1;border-radius:9px;padding:13px;background:#fbfcfd;margin-top:12px}
    .section-header,.item-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.section-header strong{color:var(--blue);font-size:13px}.item-header strong{font-size:12px}
    .item-card{border:1px solid #dde4ea;border-radius:8px;padding:12px;background:#fff;margin-top:10px}.item-card .form-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .trt-preview{font-size:11px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:7px;background:#fafbfd}.time-auto{background:#f3f5f7;color:#69737d}.time-auto:disabled{opacity:1;cursor:not-allowed}
    .sticky-actions{position:sticky;bottom:0;z-index:10;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px -0px 0;margin-top:14px;display:flex;justify-content:flex-end;gap:8px}
    .editor-workspace{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:14px;align-items:start}
    .editor-pane{min-width:0}.live-preview-wrap{min-width:0;position:sticky;top:14px}
    .live-preview{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(24,42,60,.06)}
    .live-preview-head{padding:12px 14px;background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .live-preview-head strong{font-size:12px;letter-spacing:.2px}.live-preview-badge{font-size:9px;font-weight:900;background:#f3c400;color:#111;padding:4px 7px;border-radius:999px}
    .live-preview-body{max-height:calc(100vh - 120px);overflow:auto;padding:16px;background:#fafbfc}
    .live-preview-title{font-size:18px;font-weight:900;color:var(--blue);line-height:1.15;margin-bottom:4px}.live-preview-meta{font-size:10px;color:var(--muted);margin-bottom:14px}
    .live-preview-section{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:10px}.live-preview-section h3{font-size:12px;color:var(--blue);margin:0 0 4px}.live-preview-section-time{font-size:10px;color:var(--muted);margin-bottom:9px}
    .live-preview-item{padding:8px 0;border-top:1px solid #edf0f3}.live-preview-item:first-of-type{border-top:0}.live-preview-item-title{font-size:11px;font-weight:800;line-height:1.35}.live-preview-item-line{font-size:9px;color:#66727f;margin-top:3px}.live-preview-note{font-size:9px;color:#8a6000;margin-top:4px;line-height:1.35}

    /* PROGRAM SEQUENCE — exact prompter template styling */
    .sequence-editor-workspace .editor-pane{min-width:0}
    .sequence-editor-workspace #sequenceItemsRoot{display:flex;flex-direction:column;gap:20px}
    .sequence-template-card{position:relative;background:#000;border:0;border-radius:0;overflow:visible;padding:0;margin:0;box-shadow:none;color:#fff}
    .sequence-template-take{display:flex;align-items:center;gap:0;background:#ffc400;color:#111;min-height:31px;font-weight:900;padding:0 8px;font-size:18px;line-height:1.15}
    .sequence-template-take .seq-number{width:36px;flex:0 0 36px;background:transparent;border:0;box-shadow:none;color:#111;font-weight:900;font-size:18px;padding:0;text-align:center;border-radius:0}
    .sequence-template-take .seq-time{width:190px;margin-left:3px;background:transparent;border:0;box-shadow:none;color:#111;font-weight:900;font-size:18px;padding:0;text-align:left;border-radius:0}
    .sequence-template-take .seq-time::placeholder{color:#b8b8b8;opacity:1}
        .sequence-template-take input:focus{outline:none;box-shadow:none}
    .sequence-template-spec{display:flex;align-items:center;background:#dcefd6;min-height:31px;padding:0 8px;color:#0878c8}
    .sequence-template-spec .spec-prefix{flex:0 0 auto;color:#0878c8;font-weight:900;font-size:18px;line-height:1.15}
    .sequence-template-spec .seq-title{display:block;width:100%;background:transparent;border:0;box-shadow:none;color:#0878c8;font-weight:900;font-size:18px;padding:0;resize:none;min-height:31px;line-height:1.15;border-radius:0}
    .sequence-template-spec .seq-title::placeholder{color:#a9b4bd;opacity:1}
    .sequence-template-spec .seq-title:focus{outline:none;box-shadow:none}
    .sequence-template-detail-wrap{background:#000;min-height:42px}
    .sequence-template-script-wrap{background:#000;min-height:52px;margin-top:2px}
    .sequence-template-script{display:block;width:100%;min-height:52px;box-sizing:border-box;background:#000;border:0;box-shadow:none;color:#fff;caret-color:#fff;font-weight:900;font-size:18px;line-height:1.15;padding:4px 8px;resize:vertical;outline:none;overflow:auto;border-radius:0}
    .sequence-template-script::placeholder{color:#a9a9a9;opacity:1}
    .sequence-script-marker{font-weight:900;font-style:italic;color:#fff}
    .sequence-action-script{font-style:italic;color:#e51919;font-weight:900}

    .sequence-template-detail{display:block;width:100%;min-height:42px;box-sizing:border-box;background:#000;border:0;box-shadow:none;color:#fff;caret-color:#fff;font-weight:900;font-size:18px;line-height:1.15;padding:0 8px;resize:vertical;outline:none;overflow:auto;border-radius:0}
    .sequence-template-detail::placeholder{color:#a9a9a9;opacity:1}
    .sequence-format-line{min-height:21px;line-height:1.5;margin-bottom:.35em}.sequence-format-line + .sequence-format-line{margin-top:.05em}
    .sequence-format-oncam{display:flex;align-items:flex-start;gap:0;line-height:1.15}
    .sequence-format-oncam-label{color:#00b85a;font-weight:900;flex:0 0 120px}
    .sequence-format-oncam-name{color:#fff;font-weight:900;min-width:0;flex:1}
    .sequence-format-oncam-cont{margin-left:120px;color:#fff;font-weight:900;line-height:1.15}
    .sequence-template-media,.sequence-template-link,.sequence-template-notes{display:none!important}
    .sequence-template-remove{position:static!important;margin-left:auto!important;flex:0 0 auto!important;border:0!important;background:#222!important;color:#fff!important;border-radius:4px!important;padding:3px 7px!important;font-size:9px!important;z-index:5}

    /* Program Sequence preview / prompt — same template */
    .sequence-prompt-preview{background:#000;color:#fff;padding:0;border-radius:0}
    .sequence-prompt-preview .sequence-preview-header{margin:0 0 20px}
    .sequence-prompt-preview .sequence-preview-program-title{color:#0878c8;font-weight:900;font-size:22px;line-height:1.15;margin:0 0 4px}
    .sequence-prompt-preview .sequence-preview-program-meta:empty{display:none}.sequence-prompt-preview .sequence-preview-program-meta{color:#fff;font-weight:900;font-size:18px;line-height:1.15;margin:0 0 2px}
    .sequence-prompt-preview .sequence-preview-take{margin:0 0 20px}
    .sequence-prompt-preview .sequence-preview-takebar{background:#ffc400;color:#111;font-weight:900;padding:0 8px;min-height:31px;font-size:18px;line-height:1.15}
    .sequence-prompt-preview .sequence-preview-spec{background:#dcefd6;color:#0878c8;font-weight:900;padding:0 8px;min-height:31px;font-size:18px;line-height:1.15}
    .sequence-prompt-preview .sequence-preview-detail{color:#fff;font-weight:900;padding:0 8px;font-size:18px;line-height:1.15;white-space:pre-wrap}
    .sequence-preview-oncam{display:flex;align-items:flex-start;padding:0 8px;font-size:18px;line-height:1.15}
    .sequence-preview-oncam-label{color:#00b85a;font-weight:900;flex:0 0 120px}
    .sequence-preview-oncam-name{color:#fff;font-weight:900;min-width:0;flex:1}
    .sequence-preview-oncam-cont{margin-left:120px;color:#fff;font-weight:900;padding:0;font-size:18px;line-height:1.15}
    .sequence-preview-script-marker{color:#fff;font-style:italic;font-weight:900;padding:2px 8px;font-size:18px;line-height:1.15}.sequence-preview-action-script{color:#e51919;font-style:italic;font-weight:900;padding:2px 8px;font-size:18px;line-height:1.15}
    .sequence-text-name{font-weight:900;color:#fff;padding:2px 8px;font-size:18px;line-height:1.5;margin-bottom:.35em}.sequence-editor-workspace textarea,.sequence-editor-workspace input{font-family:Arial,Helvetica,sans-serif}.sequence-editor-workspace .seq-title,.sequence-editor-workspace .seq-participants,.sequence-editor-workspace .seq-notes{text-transform:uppercase}
    .sequence-text-cont{font-weight:400;color:#fff;padding:2px 8px 2px 8px;margin-left:32px;font-size:18px;line-height:1.5;margin-bottom:.35em}
    .sequence-display-text-name,.sequence-display-text-cont{font-size:clamp(18px,2.1vw,34px);line-height:1.5;margin-bottom:.35em}
    .sequence-display-text-name{font-weight:900;color:#fff;padding:2px 0}
    .sequence-display-text-cont{font-weight:400;color:#fff;padding:2px 0;margin-left:34px}
    .sequence-preview-text-name{font-weight:900;color:#fff;padding:2px 8px;font-size:18px;line-height:1.5;margin-bottom:.35em}
    .sequence-preview-text-cont{font-weight:400;color:#fff;padding:2px 8px;margin-left:32px;font-size:18px;line-height:1.5;margin-bottom:.35em}
    .sequence-preview-end{background:#c9e7f5;color:#0878c8;font-weight:900;padding:0 8px;min-height:31px;font-size:18px;line-height:1.15}
    .sequence-preview-endnote{background:#073763;color:#fff;font-weight:900;padding:5px 8px;font-size:18px;line-height:1.15}

    .sequence-display-oncam{display:flex;align-items:flex-start;padding:0;font-size:clamp(12px,2.2vw,24px);line-height:1.15}
    .sequence-display-oncam-label{color:#00b85a;font-weight:900;flex:0 0 120px}
    .sequence-display-oncam-name{color:#fff;font-weight:900;min-width:0;flex:1}
    .sequence-display-oncam-cont{margin-left:120px;color:#fff;font-weight:900;padding:0;font-size:clamp(12px,2.2vw,24px);line-height:1.15}
    .sequence-display-detail{color:#fff;font-weight:900;padding:0;font-size:clamp(12px,2.2vw,24px);line-height:1.15;white-space:pre-wrap}
    .sequence-display-take{background:#ffc400;color:#111;font-weight:900;font-size:clamp(17px,2.2vw,38px);line-height:1.15;padding:0 8px;min-height:31px}
    .sequence-display-spec{background:#dcefd6;color:#0878c8;font-weight:900;font-size:clamp(17px,2.2vw,38px);line-height:1.15;padding:0 8px;min-height:31px}
    .sequence-display-script-marker{color:#fff;font-style:italic;font-weight:900;padding:2px 0;font-size:clamp(15px,1.9vw,32px);line-height:1.18}.sequence-display-action-script{color:#e51919;font-style:italic;font-weight:900;padding:2px 0;font-size:clamp(15px,1.9vw,32px);line-height:1.18}
    .sequence-display-end{background:#c9e7f5;color:#0878c8;font-weight:900;font-size:clamp(17px,2.2vw,38px);line-height:1.15;padding:0 8px;min-height:31px}
    .sequence-display-endnote{background:#073763;color:#fff;font-weight:900;font-size:clamp(17px,2.2vw,38px);line-height:1.15;padding:5px 8px}

    .preview-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
    .preview-title{font-size:20px;font-weight:800;color:var(--blue)}.preview-meta{color:var(--muted);font-size:12px;line-height:1.6}
    .preview-section{margin-top:18px}.preview-section h3{margin:0;padding:10px 12px;background:var(--yellow);font-size:15px}.preview-section-meta{font-size:11px;color:var(--muted);margin:6px 0}
    .preview-item{padding:10px 0;border-bottom:1px solid var(--line)}.preview-item:last-child{border-bottom:0}.preview-item-title{font-weight:800}.preview-item-line{font-size:11px;color:#55616d;margin-top:4px}.preview-note{font-size:11px;color:#8a4f00;margin-top:4px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(8,16,24,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}.modal-backdrop.show{display:flex}
    .modal{background:#fff;border-radius:10px;max-width:880px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 70px rgba(0,0,0,.25)}.modal-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head strong{color:var(--blue)}.modal-body{padding:16px}.modal-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
    .toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:10px 13px;border-radius:8px;font-size:12px;display:none;z-index:2000}.toast.show{display:block}

    /* SSG ACCOUNT AUTHENTICATION */
    .auth-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(135deg,#f5f7fa 0%,#eef3f8 100%)}
    .auth-card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 60px rgba(7,55,99,.12);padding:28px}
    .auth-brand{font-size:21px;font-weight:900;color:var(--blue);line-height:1.15}.auth-brand small{display:block;margin-top:5px;color:var(--muted);font-size:10px;letter-spacing:.6px}
    .auth-sub{margin:11px 0 20px;color:var(--muted);font-size:12px;line-height:1.5}.auth-mode{border:1px solid var(--line);border-radius:11px;padding:15px;margin-top:11px}.auth-mode h3{margin:0 0 5px;color:#1f2933;font-size:13px}.auth-mode p{margin:0 0 10px;color:var(--muted);font-size:11px;line-height:1.45}.auth-input{margin-bottom:8px}.auth-note{margin-top:12px;font-size:10px;color:#7a848f;line-height:1.45}.auth-error{display:none;margin-top:10px;background:#fff1f1;border:1px solid #efc4c6;color:#9b2117;border-radius:8px;padding:9px 10px;font-size:11px;line-height:1.4}.auth-error.show{display:block}
    .auth-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.auth-choice .btn{min-height:48px}.auth-back{margin-bottom:12px}.auth-account-meta{font-size:10px;color:var(--muted);margin-top:5px}.header-user{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.header-user-role{font-size:10px;font-weight:900;color:var(--blue)}.header-user-email{font-size:10px;color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .guest-table-wrap{overflow:auto}.guest-table{width:100%;border-collapse:collapse;min-width:760px}.guest-table th{background:var(--blue);color:#fff;font-size:10px;text-align:left;padding:10px;white-space:nowrap}.guest-table td{border-bottom:1px solid var(--line);padding:10px;font-size:11px;vertical-align:middle}.guest-table tr:hover td{background:#fafcfe}.guest-status{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900}.guest-active{background:#eaf6ee;color:#176b34}.guest-blocked{background:#fde8e8;color:#9b2117}.guest-actions{display:flex;gap:5px;flex-wrap:wrap}.guest-empty{padding:28px;text-align:center;color:var(--muted);font-size:11px}
        .save-status{font-size:10px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff}.save-status.saved{color:#176b34;border-color:#bfe3c9;background:#f4fbf6}.save-status.saving{color:#8a6000;border-color:#f0d58a;background:#fffaf0}.save-status.error{color:#9b2117;border-color:#efb8b2;background:#fff6f5}
@media(max-width:720px){.auth-gate{padding:12px}.auth-card{padding:20px;border-radius:13px}.auth-brand{font-size:19px}.header-user{justify-content:flex-start}.header-user-email{max-width:100%}.guest-table{min-width:680px}}


    /* MCGI MEDIA / FILE LIBRARY */
    .media-picker,.song-picker{position:relative}
    .media-picker-input{position:relative}
    .media-picker-results,.song-picker-results{position:absolute;left:0;right:0;top:100%;z-index:80;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 28px rgba(0,0,0,.14);max-height:280px;overflow:auto;display:none;margin-top:4px}
    .media-picker-results.show,.song-picker-results.show{display:block}
    .media-result{padding:9px 10px;border-bottom:1px solid #edf0f3;cursor:pointer}
    .media-result:last-child{border-bottom:0}
    .media-result:hover{background:#f5f8fb}
    .media-result-name{font-size:11px;font-weight:800;color:#1e2a35;line-height:1.3;overflow-wrap:anywhere}
    .media-result-meta{font-size:9px;color:var(--muted);margin-top:3px;line-height:1.3}
    .media-selected{margin-top:6px;padding:7px 8px;background:#f5f8fb;border:1px solid #dbe3ea;border-radius:7px;font-size:10px;color:#44515d;display:flex;align-items:center;gap:7px}
    .media-selected strong{color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .media-clear{border:0;background:transparent;color:var(--red);font-size:10px;font-weight:800;padding:2px 4px;cursor:pointer}


    .sequence-item{background:#fff}.control-scheduled{font-size:10px;color:#66717e;margin-top:5px}.control-timer.done{color:#17823b}.sequence-item .item-header strong{color:var(--blue)}
    .display-sequence .display-item-time{color:#fff}

    /* DISPLAY WINDOW */
    .display-shell{height:100vh;background:#000;color:#fff;overflow:hidden;display:grid;grid-template-columns:minmax(0,65fr) minmax(0,35fr);position:relative}
    .display-main{min-width:0;height:100vh;position:relative;background:#000}
    .display-scroll{height:100%;overflow:auto;padding:6vh 7vw 30vh 7vw;scroll-behavior:smooth}
    .display-title{font-size:clamp(22px,3vw,46px);font-weight:800;margin:0 0 7vh;line-height:1.08}
    .display-section{margin-bottom:7vh}.display-section-title{display:block;background:#f3c400;color:#111;font-weight:900;font-size:clamp(18px,2.1vw,36px);padding:12px 18px;margin-bottom:24px;letter-spacing:.2px}

        type:'SSG_BRIDGE_REQUEST',
        id:item.id,
        method:item.method,
        args:item.args
      }, bridgeOrigin);
    }

    function flush(){
      while(ready && queue.length) send(queue.shift());
    }

    function request(method, args, success, failure){
      if(!endpoint){
        const err = new Error('Apps Script backend URL is not configured in config.js.');
        if(typeof failure === 'function') failure(err); else handleError(err);
        return;
      }
      const id = 'req_' + (++sequence) + '_' + Date.now();
      send({id:id,method:String(method),args:Array.isArray(args)?args:[],success:success,failure:failure});
    }

    window.addEventListener('message', function(event){
      if(!BRIDGE_ORIGINS.has(event.origin)) return;
      const data = event.data || {};
      if(data.type === 'SSG_BRIDGE_READY'){
        ready = true;
        flush();
        return;
      }
      if(data.type !== 'SSG_BRIDGE_RESPONSE') return;
      const item = pending.get(data.id);
      if(!item) return;
      pending.delete(data.id);
      if(data.ok){
        if(typeof item.success === 'function') item.success(data.result);
      }else{
        const err = new Error((data.error && data.error.message) || 'Backend request failed.');
        err.backend = data.error || null;
        if(typeof item.failure === 'function') item.failure(err); else handleError(err);
      }
    });

    iframe = document.createElement('iframe');
    iframe.id = 'ssgAppsScriptBridge';
    iframe.title = 'SSG backend bridge';
    iframe.setAttribute('aria-hidden','true');
    iframe.style.position='fixed';
    iframe.style.width='1px';
    iframe.style.height='1px';
    iframe.style.left='-10000px';
    iframe.style.top='-10000px';
    iframe.style.border='0';
    iframe.style.opacity='0';
    iframe.src = endpoint + (endpoint.indexOf('?') >= 0 ? '&' : '?') + 'mode=bridge';
    document.body.appendChild(iframe);

    function makeRunner(success, failure){
      const runner = {
        withSuccessHandler(fn){ return makeRunner(fn, failure); },
        withFailureHandler(fn){ return makeRunner(success, fn); }
      };
      return new Proxy(runner, {
        get(target, prop){
          if(prop in target) return target[prop];
          return (...args) => request(String(prop), args, success, failure);
        }
      });
    }

    window.google = window.google || {};
    window.google.script = window.google.script || {};
    window.google.script.run = makeRunner(null, null);
  })();

  function safeRun(method, args, ok){

      if(!state.liveSession.id)return;

          if(APP_CONFIG.mode==='editor' && st.guide && st.guide.id){

  function parseClockSeconds(value){
    const s=String(value||'').trim().toUpperCase();
    if(!s)return null;
    const m=s.match(/^(\d{1,2})(?::(\d{2}))?(?::(\d{2}))?\s*(AM|PM)?$/);
    if(!m)return null;
    let h=Number(m[1]), min=Number(m[2]||0), sec=Number(m[3]||0), ap=m[4]||'';
    if(min>59||sec>59)return null;
    if(ap){
      if(h<1||h>12)return null;
      if(ap==='AM'&&h===12)h=0;
      if(ap==='PM'&&h!==12)h+=12;
    }else if(h>23)return null;
    return h*3600+min*60+sec;
  }

  function parseTrtSeconds(value){
    const s=String(value||'').trim().toUpperCase();
    if(!s)return null;

    // Flexible clock-style TRT: MM:SS or H:MM:SS.
    let m=s.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/);
    if(m){
      if(m[3]!==undefined){
        const h=Number(m[1]), min=Number(m[2]), sec=Number(m[3]);
        if(min>59||sec>59)return null;
        return h*3600+min*60+sec;
      }
      const min=Number(m[1]), sec=Number(m[2]);
      if(sec>59)return null;
      return min*60+sec;
    }

    let total=0, found=false;
    const hr=s.match(/(\d+(?:\.\d+)?)\s*(?:H|HR|HRS|HOUR|HOURS)\b/);
    const min=s.match(/(\d+(?:\.\d+)?)\s*(?:M|MIN|MINS|MINUTE|MINUTES)\b/);
    const sec=s.match(/(\d+(?:\.\d+)?)\s*(?:S|SEC|SECS|SECOND|SECONDS)\b/);
    if(hr){total+=Number(hr[1])*3600;found=true;}
    if(min){total+=Number(min[1])*60;found=true;}
    if(sec){total+=Number(sec[1]);found=true;}
    return found?Math.round(total):null;
  }

  function formatTrtSeconds(seconds){
    if(seconds===null||seconds===undefined||isNaN(seconds)||seconds<0)return '';
    seconds=Math.round(seconds);
    const h=Math.floor(seconds/3600);
    const rem=seconds%3600;
    const m=Math.floor(rem/60);
    const s=rem%60;
    if(h>0)return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  function formatClockSeconds(seconds){
    if(seconds===null||seconds===undefined||isNaN(seconds))return '';
    seconds=((Math.round(seconds)%86400)+86400)%86400;
    let h=Math.floor(seconds/3600);
    const m=Math.floor((seconds%3600)/60);
    const sec=seconds%60;
    const ap=h>=12?'PM':'AM';
    h=h%12||12;
    return h+':'+String(m).padStart(2,'0')+(sec?':'+String(sec).padStart(2,'0'):'')+' '+ap;
  }

  function trtSecondsFromItemObject(item){

  }

  function trtDisplay(item){
    const direct=parseTrtSeconds(item?.trt||item?.duration||'');
    if(direct!==null)return formatTrtSeconds(direct);
    const a=parseClockSeconds(item?.startTime), b=parseClockSeconds(item?.endTime);
    if(a===null||b===null)return '';
    let d=b-a;if(d<0)d+=86400;
    return formatTrtSeconds(d);
  }

  function durationParts(start,end){
    const a=parseClockSeconds(start), b=parseClockSeconds(end);
    if(a===null||b===null)return '';
    let d=b-a;if(d<0)d+=86400;
    return formatTrtSeconds(d);
  }

  function durationSeconds(start,end){
    const a=parseClockSeconds(start), b=parseClockSeconds(end);
    if(a===null||b===null)return 0;
    let d=b-a;if(d<0)d+=86400;
    return d;
  }

  function formatClock(ms){
    let total=Math.max(0,Math.floor(ms/1000));
    const h=Math.floor(total/3600); total%=3600; const m=Math.floor(total/60); const s=total%60;
    return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
  }

  function hydrateGuideForEditor(g){
    if(!g)return g;
    g.sections=(g.sections||[]).map(function(sec,si){
      const out=Object.assign({},sec);
      out.items=(sec.items||[]).map(function(it){
        const item=Object.assign({},it);
        if(!item.trt){
          const d=durationSeconds(item.startTime,item.endTime);
          item.trt=d?formatTrtSeconds(d):'';
        }else{
          const d=parseTrtSeconds(item.trt);
          if(d!==null)item.trt=formatTrtSeconds(d);
        }
        return item;
      });
      if(typeof out._manualEnd!=='boolean'){
        const last=out.items.length?out.items[out.items.length-1]:null;
        const derived=last?.endTime||'';
        const a=parseClockSeconds(out.endTime),b=parseClockSeconds(derived);
        out._manualEnd=!!out.endTime && (a===null||b===null||a!==b);
      }
      return out;
    });
    return g;
  }

  function recalculateEditorTimes(){
    const sections=Array.from(document.querySelectorAll('.section-card'));
    let previousSectionEnd=null;

    sections.forEach(function(card,sidx){
      const startInput=card.querySelector('.sec-start');
      const endInput=card.querySelector('.sec-end');
      const manualEnd=card.dataset.manualEnd==='1';

      if(sidx===0){
        previousSectionEnd=parseClockSeconds(startInput?.value||'');
      }else{
        const autoStart=previousSectionEnd;
        if(startInput){
          startInput.value=autoStart===null?'':formatClockSeconds(autoStart);
          startInput.disabled=true;
          startInput.classList.add('time-auto');
        }
      }

      let cursor=parseClockSeconds(startInput?.value||'');

      Array.from(card.querySelectorAll('.item-card')).forEach(function(itemCard){
        const startEl=itemCard.querySelector('.item-start');
        const endEl=itemCard.querySelector('.item-end');
        const trtEl=itemCard.querySelector('.item-trt-input');
        const seconds=parseTrtSeconds(trtEl?.value||'');

        if(startEl){
          startEl.value=cursor===null?'':formatClockSeconds(cursor);
          startEl.readOnly=true;
          startEl.classList.add('time-auto');
        }

        if(seconds!==null && cursor!==null){
          const end=cursor+seconds;
          if(endEl)endEl.value=formatClockSeconds(end);
          cursor=end;
        }else{
          if(endEl)endEl.value='';
          cursor=null;
        }

        if(trtEl && seconds!==null){
          trtEl.value=formatTrtSeconds(seconds);
        }
      });

      if(endInput && !manualEnd && cursor!==null){
        endInput.value=formatClockSeconds(cursor);
      }

      previousSectionEnd=parseClockSeconds(endInput?.value||'');
    });

    syncGuide();
    renderLivePreview();
  }

  function sendToPresenterMode(mode,type,payload){
    const commandId=presenterCommandId();
    const msg=Object.assign({type:type,commandId:commandId},payload||{});
    markPresenterCommand(commandId);
    // BroadcastChannel handles the already-open presenter windows without
    // ever activating/focusing either window.
    sendPresenterChannel(msg);
    // The main app relays timer/active-item messages to the display window.
    try{ window.opener?.postMessage(Object.assign({ssgPresenter:true},msg),'*'); }catch(err){}
    return msg;
  }
  function focusPresenterWindow(mode){
    try{
      const stored = mode==='display' ? state.displayWindow : state.controlWindow;
      if(stored && !stored.closed){ stored.focus(); return true; }
    }catch(err){}
    try{
      const name = mode==='display' ? 'SSG_PROGRAM_DISPLAY' : 'SSG_PROGRAM_CONTROL';
      const w = window.open('', name);
      if(w){ w.focus(); return true; }
    }catch(err){}
    return false;
  }
  function requestPresenterTargetToggle(currentTarget, sourceMode){
    const next=currentTarget==='control'?'display':'control';
    const id=presenterCommandId();
    const msg={ssgPresenter:true,type:'toggleTarget',target:next,sourceMode:sourceMode,commandId:id};
    markPresenterCommand(id);
    try{ window.opener?.postMessage(msg,'*'); }catch(err){}
    // Keep both windows visually in sync even before the parent replies.
    sendPresenterChannel({type:'targetState',target:next,commandId:presenterCommandId()});
    return next;
  }

          const m=(err&&err.message)||String(err);

  function formatSequenceDetailsHtml(text, editorMode){
    const raw=String(text||'').replace(/\r/g,'');
    if(!raw.trim()) return editorMode ? '<div class="sequence-format-line">- NAME / SONG TITLE / NOTES INPUT HERE</div>' : '';
    const lines=raw.split('\n');
    let html='';
    let lastWasOncam=false;
    lines.forEach(line=>{
      const trimmed=line.trim();
      if(!trimmed){html+='<div class="sequence-format-line">&nbsp;</div>';lastWasOncam=false;return;}
      const m=trimmed.match(/^(ONCAM(?:\s*\d+)?)\s*:\s*(.*)$/i);
      if(m){
        html+='<div class="sequence-format-oncam"><span class="sequence-format-oncam-label">'+esc(m[1].toUpperCase())+':</span><span class="sequence-format-oncam-name">'+esc(m[2]||'')+'</span></div>';
        lastWasOncam=true;
      }else if(lastWasOncam){
        html+='<div class="sequence-format-oncam-cont">'+esc(trimmed)+'</div>';
      }else{
        html+='<div class="sequence-format-line">'+esc(trimmed)+'</div>';
        lastWasOncam=false;
      }
    });
    return html;
  }

  function formatSequenceScriptHtml(text, editorMode){
    const raw=String(text||'').replace(/\r/g,'');
    if(!raw.trim()) return '';
    const lines=raw.split('\n');
    let html='';
    let actionMode=false;
    let textMode=false;
    lines.forEach(line=>{
      const trimmed=line.trim();
      if(trimmed==='SCRIPT'){
        html+='<div class="sequence-script-marker">//SCRIPT//</div>';
        return;
      }
      if(trimmed==='***'){
        actionMode=!actionMode;
        return;
      }
      if(trimmed==='\\'){
        textMode=false;
        actionMode=false;
        return;
      }
      if(!trimmed){
        html+='<div class="sequence-format-line">&nbsp;</div>';
        return;
      }
      const textName=trimmed.match(/^TEXT\s*:\s*(.*)$/i);
      if(textName){
        textMode=true;
        const name=textName[1]||'';
        html+='<div class="sequence-text-name">'+esc(name)+'</div>';
        return;
      }
      const wrappedAction=trimmed.match(/^\*\*\*(.*?)\*\*\*$/);
      if(wrappedAction){
        html+='<div class="sequence-action-script">'+esc(wrappedAction[1])+'</div>';
      }else if(textMode){
        html+='<div class="sequence-text-cont">'+esc(line)+'</div>';
      }else if(actionMode){
        html+='<div class="sequence-action-script">'+esc(line)+'</div>';
      }else{
        html+='<div class="sequence-format-line">'+esc(line)+'</div>';
      }
    });
    return html;
  }

  function setupSongPicker(itemCard){
    const input=itemCard.querySelector('.item-song-search'),results=itemCard.querySelector('.song-picker-results');
    if(!input||!results)return;
    let timer=null;
    let seq=0;

    function runSearch(q,requestSeq){
      const token=state.auth?.token||getStoredAuth()?.token||'';
      google.script.run.withSuccessHandler(function(rows){
        if(requestSeq!==seq)return;
        rows=rows||[];
        if(!rows.length){
          results.innerHTML='<div class="media-result"><div class="media-result-meta">No matching MCGI songs/media/files found.</div></div>';
          return;
        }
        results.innerHTML=rows.map(function(r){
          return '<div class="media-result" data-title="'+escAttr(r.title)+'" data-link="'+escAttr(r.link||'')+'" data-file-id="'+escAttr((String(r.link||'').match(/[-\w]{20,}/)||[''])[0])+'">'
            +'<div class="media-result-name">'+esc(r.title)+'</div>'
            +'<div class="media-result-meta">'+esc(r.mediaType||'FILE')+' · '+esc(r.source||'MCGI Song Database')+(r.sheet?' · '+esc(r.sheet):'')+'</div>'
            +'</div>';
        }).join('');

        results.querySelectorAll('.media-result[data-title]').forEach(function(row){
          row.addEventListener('click',function(){
            const title=this.dataset.title||'';
            const link=this.dataset.link||'';
            const linkInput=itemCard.querySelector('.item-link');

            // Selected database result goes ONLY into the search field + Link.
            // Item Title is a separate manual field and is never overwritten.
            input.value=title;
            itemCard.dataset.mediaUrl=link;
            if(linkInput){
              linkInput.value=link;
              linkInput.dispatchEvent(new Event('input',{bubbles:true}));
            }

            results.classList.remove('show');
            results.innerHTML='';
            autoFillVideoTrt(itemCard,this.dataset.fileId||'');
            syncGuide();
            renderLivePreview();
            if(APP_CONFIG.mode==='editor')scheduleLiveEditorPublish();
          });
        });
      }).withFailureHandler(function(err){
        if(requestSeq!==seq)return;
        results.innerHTML='<div class="media-result"><div class="media-result-meta">Unable to search MCGI Song / Media Library: '+esc(err?.message||err)+'</div></div>';
      }).apiCall('searchMcgiSongs',[q],token);
    }

    input.addEventListener('input',function(){
      const q=this.value.trim();
      if(timer)clearTimeout(timer);
      seq++;
      const requestSeq=seq;
      if(q.length<1){
        results.classList.remove('show');
        results.innerHTML='';
        return;
      }
      results.innerHTML='<div class="media-result"><div class="media-result-meta">Searching local MCGI Song / Media Database...</div></div>';
      results.classList.add('show');
      // Short debounce only; the actual search is a local indexed-sheet lookup.
      timer=setTimeout(()=>runSearch(q,requestSeq),90);
    });

    input.addEventListener('focus',function(){
      if(this.value.trim().length>=1 && results.innerHTML)results.classList.add('show');
    });
    input.addEventListener('keydown',function(e){
      if(e.key==='Escape'){
        results.classList.remove('show');
        results.innerHTML='';

  function setupMediaPicker(itemCard){

    const results=itemCard.querySelector('.media-picker-results');

    const clearBtn=itemCard.querySelector('.media-clear');

    input.addEventListener('input',function(){

      if(mediaSearchTimers[itemCard.dataset.itemId]) clearTimeout(mediaSearchTimers[itemCard.dataset.itemId]);
      if(q.length<2){ results.classList.remove('show'); results.innerHTML=''; return; }
      results.innerHTML='<div class="media-result"><div class="media-result-meta">Searching Parent MCGI Music Department Drive...</div></div>';
      results.classList.add('show');

        google.script.run.withSuccessHandler(function(files){
          files=files||[];
          if(!files.length){
            results.innerHTML='<div class="media-result"><div class="media-result-meta">No matching files found.</div></div>';
            return;
          }
          results.innerHTML=files.map(function(file){
            return '<div class="media-result" data-file-id="'+escAttr(file.id)+'" data-file-name="'+escAttr(file.name)+'" data-file-url="'+escAttr(file.url)+'"><div class="media-result-name">'+esc(file.name)+'</div><div class="media-result-meta">'+esc(file.folder||'MCGI Music Department')+' · '+esc(file.mimeType||'File')+'</div></div>';

            row.addEventListener('click',function(){

              itemCard.dataset.mediaUrl=this.dataset.fileUrl||'';
              results.classList.remove('show');

              autoFillVideoTrt(itemCard,row.dataset.fileId||'');

          results.innerHTML='<div class="media-result"><div class="media-result-meta">Unable to search the Parent MCGI Music Department Drive: '+esc(err?.message||err)+'</div></div>';
        }).apiCall('searchMcgiMedia',[q],token);
      },300);
    });

    input.addEventListener('focus',function(){
      if(this.value.trim().length>=2 && results.innerHTML) results.classList.add('show');
    });
    if(clearBtn){
      clearBtn.addEventListener('click',function(){
        input.value='';
        itemCard.dataset.mediaUrl='';
        if(selected)selected.style.display='none';
        results.classList.remove('show');
        results.innerHTML='';
        renderLivePreview();
        if(APP_CONFIG.mode==='editor')scheduleLiveEditorPublish();

  let guideAutoSaveTimer=null;
  let guideAutoSaveBusy=false;
  let guideAutoSaveQueued=false;
  let guideAutoSaveSnapshotHash='';
  function updateGuideSaveStatus(message,kind){
    const el=$('guideSaveStatus');
    if(!el)return;
    el.textContent=message||'';
    el.className='save-status '+(kind||'');
  }
  function scheduleGuideAutoSave(){
    if(APP_CONFIG.mode==='editor')return;
    if(!state.guide?.id)return;
    clearTimeout(guideAutoSaveTimer);
    updateGuideSaveStatus('Saving…','saving');
    guideAutoSaveTimer=setTimeout(runGuideAutoSave,500);
  }
  function runGuideAutoSave(){
    if(APP_CONFIG.mode==='editor')return;
    if(!state.guide?.id)return;
    syncGuide();
    if(!String(state.guide.title||'').trim())return;
    const snapshot=clone(state.guide);
    let hash='';
    try{hash=JSON.stringify(snapshot);}catch(err){hash='';}
    if(hash && hash===guideAutoSaveSnapshotHash){
      updateGuideSaveStatus(`Saved ${state.guide.updatedAt||''}`.trim(),'saved');
      return;
    }
    if(guideAutoSaveBusy){guideAutoSaveQueued=true;return;}
    guideAutoSaveBusy=true;
    guideAutoSaveQueued=false;
    updateGuideSaveStatus('Saving…','saving');
    const token=state.auth?.token||getStoredAuth()?.token||'';
    google.script.run.withSuccessHandler(result=>{
      guideAutoSaveBusy=false;
      if(result?.guide){
        state.guide=result.guide;
        guideAutoSaveSnapshotHash=hash;
        updateGuideSaveStatus(`✓ Saved ${result.guide.updatedAt||''}`.trim(),'saved');
        const idx=state.guides.findIndex(g=>String(g.id)===String(result.guide.id));
        const summary={id:result.guide.id,title:result.guide.title,eventDate:result.guide.eventDate,venue:result.guide.venue,organizersCallTime:result.guide.organizersCallTime,formalStart:result.guide.formalStart,mainBgm:result.guide.mainBgm,fileLink:result.guide.fileLink,createdAt:result.guide.createdAt,updatedAt:result.guide.updatedAt,type:result.guide.type,ownerUsername:result.guide.ownerUsername,ownerName:result.guide.ownerName,visibility:result.guide.visibility,publicAccess:result.guide.publicAccess,isOwner:true,canEdit:true};
        if(idx>=0)state.guides[idx]=summary;else state.guides.unshift(summary);
        showToast('Guide saved successfully. You can check it in Saved Guides.');
      }
      const queued=guideAutoSaveQueued;guideAutoSaveQueued=false;
      if(queued)runGuideAutoSave();
    }).withFailureHandler(err=>{
      guideAutoSaveBusy=false;guideAutoSaveQueued=false;
      updateGuideSaveStatus('Save failed','error');
      handleError(err);
    }).apiCall('saveGuide',[snapshot],token);
  }

  function broadcastGuideToPresenter(){

  function setupLivePreviewListener(){
    // Bind once at document level so replacing #page-editor with a template or
    // re-rendering a saved guide can never orphan the preview/autosave listener.
    if(document.documentElement.dataset.guideEditorEventsBound==='1')return;
    document.documentElement.dataset.guideEditorEventsBound='1';
    const handle=function(e){
      const target=e.target;
      if(!target || !target.closest || !target.closest('#page-editor'))return;
      if(!state.guide || APP_CONFIG.mode==='editor' && !state.guide)return;
      try{
        if(String(state.guide.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
          syncSequenceGuide();
          renderSequencePreview();
          if(APP_CONFIG.mode==='editor') scheduleLiveEditorPublish();
          else { scheduleGuideAutoSave(); broadcastGuideToPresenter(); }
        }else{
          syncGuide();
          renderLivePreview();
          if(APP_CONFIG.mode==='editor') scheduleLiveEditorPublish();
          else { scheduleGuideAutoSave(); broadcastGuideToPresenter(); }
        }
      }catch(err){console.error(err);}
    };
    document.addEventListener('input',handle,true);
    document.addEventListener('change',handle,true);
  }

  function saveGuideClient(){
    if(APP_CONFIG.mode==='editor'){ publishLiveEditorNow(); return; }
    if(!state.guide)return;
    if(String(state.guide.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE') syncSequenceGuide();
    else syncGuide();
    if(!String(state.guide.title||'').trim()){showToast('Guide/Event Title is required.');return;}

    // Existing guides are updates. Do not reopen the Private/Public chooser and
    // accidentally change their ownership/visibility. The saved record's current
    // visibility is preserved and the guide is updated in place.
    if(String(state.guide.id||'').trim()){
      persistGuideNow('Updating guide...', '✓ Guide updated successfully.');
      return;
    }
    openGuideSaveChoice();
  }

  function persistGuideNow(startMessage, successMessage){
    showToast(startMessage||'Saving guide...');
    updateGuideSaveStatus('Saving…','saving');
    clearTimeout(guideAutoSaveTimer);
    const snapshot=clone(state.guide);
    const token=state.auth?.token || getStoredAuth()?.token || '';
    if(!token){ handleAuthFailure('Please sign in first.'); return; }

    let retried=false;
    function send(){
      google.script.run
        .withSuccessHandler(result=>{
          if(!result?.guide){
            updateGuideSaveStatus('Save failed','error');
            showToast('Guide save failed.');
            return;
          }
          state.guide=result.guide;
          guideAutoSaveSnapshotHash=JSON.stringify(clone(state.guide));
          updateGuideSaveStatus(`✓ Saved ${state.guide.updatedAt||''}`.trim(),'saved');
          const savedSummary={id:state.guide.id,title:state.guide.title,eventDate:state.guide.eventDate,venue:state.guide.venue,organizersCallTime:state.guide.organizersCallTime,formalStart:state.guide.formalStart,mainBgm:state.guide.mainBgm,fileLink:state.guide.fileLink,createdAt:state.guide.createdAt,updatedAt:state.guide.updatedAt,type:state.guide.type,ownerUsername:state.guide.ownerUsername,ownerName:state.guide.ownerName,visibility:state.guide.visibility,publicAccess:state.guide.publicAccess,isOwner:true,canEdit:true};
          const idx=state.guides.findIndex(g=>String(g.id)===String(savedSummary.id));
          if(idx>=0)state.guides[idx]=savedSummary; else state.guides.unshift(savedSummary);
          showToast(successMessage||'✓ Guide saved successfully.');
          broadcastGuideToPresenter();
        })
        .withFailureHandler(err=>{
          const message=(err&&err.message)?err.message:String(err);
          // A transient Apps Script/cache authorization miss must not immediately
          // sign the user out. Retry the same save once with the still-valid token.
          if(!retried && /^AUTH_REQUIRED:/.test(message)){
            retried=true;
            setTimeout(send,250);
            return;
          }
          updateGuideSaveStatus('Save failed','error');
          handleError(err);
        })
        .apiCall('saveGuide',[snapshot],token);
    }
    send();
  }

  function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('Copied.');}
  function buildText(g){
    let lines=[g.title||'TECH GUIDE','']; if(g.eventDate)lines.push('Event Date: '+g.eventDate); if(g.organizersCallTime)lines.push('Organizers’ Call Time: '+g.organizersCallTime); if(g.formalStart)lines.push('Formal Start: '+g.formalStart); if(g.mainBgm)lines.push('Main BGM: '+g.mainBgm); if(g.fileLink)lines.push('General File Link: '+g.fileLink); lines.push('');
    if(String(g.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      sequenceItems(g).forEach((it,ii)=>{lines.push('[TAKE '+(it.number||String(ii))+']');if(it.startTime)lines.push(it.startTime);if(it.title)lines.push('** '+it.title);if(it.participants)lines.push('ONCAM / DETAILS: '+it.participants);if(it.media)lines.push('- '+it.media);if(it.mediaUrl)lines.push('DRIVE LINK: '+it.mediaUrl);if(it.link)lines.push('EXTERNAL LINK: '+it.link);if(it.notes)lines.push('NOTE: '+it.notes);lines.push('');});
    }else{
      (g.sections||[]).forEach((s,si)=>{lines.push((si+1)+'. '+s.title);if(s.startTime||s.endTime)lines.push('TIME: '+(s.startTime||'—')+' – '+(s.endTime||'—'));if(s.notes)lines.push('NOTE: '+s.notes);lines.push('');(s.items||[]).forEach((it,ii)=>{lines.push('#'+(it.number||String(ii+1))+' '+it.title);lines.push('TIME: '+(it.startTime||'—')+' – '+(it.endTime||'—'));const d=trtDisplay(it);if(d)lines.push('TRT: '+d);if(it.media)lines.push('MEDIA / FILE: '+it.media);if(it.mediaUrl)lines.push('DRIVE LINK: '+it.mediaUrl);if(it.link)lines.push('EXTERNAL LINK: '+it.link);if(it.participants)lines.push('PARTICIPANTS / DETAILS: '+it.participants);if(it.notes)lines.push('NOTES: '+it.notes);lines.push('');});});
    }
    return lines.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  }

  function sanitizeRichHtml(html){
    const source=String(html||'');
    const box=document.createElement('div'); box.innerHTML=source;
    const walk=node=>{
      Array.from(node.childNodes).forEach(child=>{
        if(child.nodeType===3)return;
        if(child.nodeType!==1){child.remove();return;}
        const tag=child.tagName.toLowerCase();
        if(['b','strong','i','em','br'].includes(tag)){walk(child);return;}
        if(tag==='div'||tag==='p'){walk(child);const br=document.createElement('br');child.parentNode.insertBefore(br,child.nextSibling);return;}
        const frag=document.createDocumentFragment();while(child.firstChild)frag.appendChild(child.firstChild);child.replaceWith(frag);
        walk(node);
      });
    };
    walk(box);
    return box.innerHTML.replace(/(?:<br>\s*){3,}/gi,'<br><br>');
  }

  // Lyric Prompter keyboard policy:
  // MAIN WINDOW: only the triple-backquote SEND trigger is active.
  // DISPLAY WINDOW: all prompter controls are active. No control is sent back
  // as a play/pause/theme/etc. command, which prevents the heartbeat from
  // fighting the display and causing the "snick" toggle/reset behavior.
  let lyricSendBackquoteCount=0;
  let lyricSendBackquoteTimer=null;

  function setupLyricKeyboard(){
    if(window._lyricKeyboardBound)return;
    window._lyricKeyboardBound=true;
    window.addEventListener('keydown',function(e){
      // Deliberately keep the main window free of prompter controls.
      // The only main-window shortcut is: ` ` ` = Send to Prompter.
      if(APP_CONFIG.mode!=='main')return;
      if(state.page!=='lyrics'||lyricMode!=='text')return;
      if(e.code!=='Backquote' && e.key!=='`')return;

      e.preventDefault();
      e.stopPropagation();
      lyricSendBackquoteCount++;
      if(lyricSendBackquoteTimer)clearTimeout(lyricSendBackquoteTimer);
      lyricSendBackquoteTimer=setTimeout(function(){lyricSendBackquoteCount=0;},900);

      if(lyricSendBackquoteCount>=3){
        lyricSendBackquoteCount=0;
        clearTimeout(lyricSendBackquoteTimer);
        lyricSendBackquoteTimer=null;
        sendLyricToPrompter();
      }
    },true);
  }

  function sendLyricToPrompter(){
    syncLyricInputs();
    const block=activeLyricBlock();
    const text=String(block?.text||'');
    if(!text.trim()){showToast('This block has no lyrics yet.');return;}
    const base=state.bootstrap?.appUrl||APP_CONFIG.appUrl||'';
    if(!base){showToast('App URL is not ready yet.');return;}

    const payload=buildLyricPayload();
    try{localStorage.setItem(LYRIC_STORAGE_KEY,JSON.stringify({ts:Date.now(),payload:payload}));}catch(err){}
    sendLyricChannel('state',payload);

    if(!state.lyrics.displayWindow||state.lyrics.displayWindow.closed){
      state.lyrics.displayWindow=window.open(base+'?mode=lyric-display','SSG_LYRIC_PROMPTER','popup=yes,resizable=yes,scrollbars=no,width=1400,height=800');
      if(!state.lyrics.displayWindow){showToast('The prompter window was blocked. Please allow pop-ups for this site.');return;}
    }

    // The display window is intentionally focused immediately. Its keyboard
    // listener is installed during initialization, so the user does not need
    // to click the display first.
    try{
      state.lyrics.displayWindow.focus();
      state.lyrics.displayWindow.postMessage({ssgLyric:true,type:'state',payload:payload},'*');
    }catch(err){}
    startLyricDisplayHandshake();
    setTimeout(function(){try{state.lyrics.displayWindow?.focus();}catch(err){}},80);
  }

  function sendLyricState(extra){
    const payload=buildLyricPayload(extra);
    if(!String(payload.text||'').trim()) return;
    try{localStorage.setItem(LYRIC_STORAGE_KEY,JSON.stringify({ts:Date.now(),payload:payload}));}catch(err){}
    sendLyricChannel('state',payload);
    try{
      if(state.lyrics.displayWindow&&!state.lyrics.displayWindow.closed){
        state.lyrics.displayWindow.postMessage({ssgLyric:true,type:'state',payload:payload},'*');
      }
    }catch(err){}
  }

  function applyLyricDisplayPayload(p){
    const screen=$('lyricDisplayScreen'),text=$('lyricDisplayText'),scroll=$('lyricDisplayScroll');
    if(!screen||!text||!scroll)return;
    if(!displayLyricState.hasReceivedInitialState) displayLyricState.speed=Number(p.speed)||3;
    const incomingThemeVersion=Number.isFinite(Number(p.themeVersion))?Number(p.themeVersion):null;
    if(incomingThemeVersion!==null)displayLyricState.remoteThemeVersion=incomingThemeVersion;
    const modeIndex=Math.max(0,Math.min(BUILTIN_LYRIC_BACKGROUNDS.length-1,Number.isFinite(Number(p.backgroundIndex))?Number(p.backgroundIndex):0));
    screen.className='lyric-display-screen '+(modeIndex===1?'blue-theme':modeIndex===2?'people-theme':modeIndex===3?'royal-theme':'black-theme');
    const incomingText=String(p.text||'');
    const incomingBlockIndex=Number.isFinite(Number(p.blockIndex))?Number(p.blockIndex):null;
    const contentChanged=(displayLyricState.remoteBlockIndex!==null && (displayLyricState.remoteBlockIndex!==incomingBlockIndex || displayLyricState.remoteText!==incomingText));
    displayLyricState.remoteBlockIndex=incomingBlockIndex;
    displayLyricState.remoteText=incomingText;
    const incomingHtml=sanitizeRichHtml(String(p.html||textToRichHtml(incomingText)));
    text.innerHTML=incomingHtml;
    if(!displayLyricState.hasReceivedInitialState){
      displayLyricState.textSize=Math.max(22,Math.min(168,Number(p.textSize)||42));
      displayLyricState.lineWidth=Math.max(20,Math.min(100,Number(p.lineWidth)||80));
    }
    displayLyricState.backgroundIndex=modeIndex;
    displayLyricState.backgroundDataUrl=String(p.backgroundDataUrl||'');
    displayLyricState.backgroundName=String(p.backgroundName||'');
    text.style.fontSize=displayLyricState.textSize+'px';
    text.style.maxWidth=displayLyricState.lineWidth+'%';
    lyricBackgroundStyleDisplay(screen,displayLyricState.backgroundDataUrl);
    const info=$('lyricDisplayInfo');
    if(info)info.textContent='TEXT LYRICS · '+(p.tabName||'TAB 1')+' · BLOCK '+((Number(p.blockIndex)||0)+1)+' / '+(Number(p.blockCount)||1);
    if(Number.isFinite(p.scrollTop)){scroll.scrollTop=p.scrollTop;displayLyricState.scrollPosition=scroll.scrollTop;}
    else if(contentChanged){scroll.scrollTop=0;displayLyricState.scrollPosition=0;}
    else{displayLyricState.scrollPosition=scroll.scrollTop;}
    // MAIN -> DISPLAY can control scroll state when the active lyric content changes.
    // Theme/zoom/width/settings updates for the same block must NEVER pause a locally
    // running display. This prevents the scroll from unexpectedly stopping halfway.
    if(contentChanged){
      displayLyricState.localScrollControl=false;
      if(p.scrolling&&!displayLyricState.scrolling)startDisplayLyricScroll();
      if(!p.scrolling&&displayLyricState.scrolling)stopDisplayLyricScroll();
    }else if(!displayLyricState.localScrollControl){
      if(p.scrolling&&!displayLyricState.scrolling)startDisplayLyricScroll();
      if(!p.scrolling&&displayLyricState.scrolling)stopDisplayLyricScroll();
    }
    displayLyricState.hasReceivedInitialState=true;
    displayLyricState.remoteStateMayControl=true;
    try{window.opener?.postMessage({ssgLyric:true,type:'applied'},'*');}catch(err){}
  }

  const displayLyricState={hasReceivedInitialState:false,scrolling:false,speed:3,textSize:42,lineWidth:80,backgroundIndex:0,backgroundDataUrl:'',backgroundName:'',raf:null,lastArrow:{key:'',time:0},remoteThemeVersion:null,remoteStateMayControl:false,remoteBlockIndex:null,remoteText:'',localScrollControl:false,scrollPosition:0,lastScrollTime:0};
  function lyricBackgroundStyleDisplay(el,url){
    if(!el)return;
    const bg=String(url||'').trim();
    el.classList.toggle('has-custom-bg',!!bg);
    if(bg){
      el.style.backgroundImage='url("'+bg.replace(/"/g,'%22')+'")';
      el.style.backgroundSize='cover';
      el.style.backgroundPosition='center';
      el.style.backgroundRepeat='no-repeat';
    }else{
      el.style.backgroundImage='';
      el.style.backgroundSize='';
      el.style.backgroundPosition='';
      el.style.backgroundRepeat='';
    }
  }
  function sendLyricDisplayBackground(){
    const index=Number.isFinite(Number(displayLyricState.backgroundIndex))?Number(displayLyricState.backgroundIndex):0;
    const scroll=$('lyricDisplayScroll');
    const scrollTop=scroll?scroll.scrollTop:displayLyricState.scrollPosition||0;
    const payload={backgroundIndex:index,scrollTop:scrollTop};
    if(sendLyricChannel('background',payload))return;
    try{window.opener?.postMessage({ssgLyric:true,type:'background',...payload},'*');}catch(err){}
  }
  function sendLyricDisplaySettings(){
    const settings={textSize:displayLyricState.textSize,lineWidth:displayLyricState.lineWidth};
    if(sendLyricChannel('settings',settings))return;
    try{window.opener?.postMessage({ssgLyric:true,type:'settings',settings:settings},'*');}catch(err){}
  }
  function stopDisplayLyricScroll(){
    if(displayLyricState.raf)cancelAnimationFrame(displayLyricState.raf);
    displayLyricState.raf=null;
    displayLyricState.scrolling=false;
    displayLyricState.lastScrollTime=0;
    const el=$('lyricDisplayScroll');
    if(el)displayLyricState.scrollPosition=el.scrollTop;
  }
  function startDisplayLyricScroll(){
    if(displayLyricState.scrolling)return;
    const el=$('lyricDisplayScroll');
    if(!el)return;
    displayLyricState.scrolling=true;
    displayLyricState.scrollPosition=el.scrollTop;
    displayLyricState.lastScrollTime=performance.now();
    const speedTable=[22,36,54,76,104,138,178,226,284];
    const loop=(now)=>{
      if(!displayLyricState.scrolling)return;
      const area=$('lyricDisplayScroll');
      if(!area){stopDisplayLyricScroll();return;}
      const dt=Math.min(50,Math.max(0,now-displayLyricState.lastScrollTime||0));
      displayLyricState.lastScrollTime=now;
      const speed=speedTable[Math.max(1,Math.min(9,Number(displayLyricState.speed)||3))-1];
      const max=Math.max(0,area.scrollHeight-area.clientHeight);
      displayLyricState.scrollPosition=Math.min(max,displayLyricState.scrollPosition+(speed*dt/1000));
      area.scrollTop=Math.round(displayLyricState.scrollPosition);
      if(displayLyricState.scrollPosition>=max){
        displayLyricState.scrollPosition=max;
        area.scrollTop=max;
        stopDisplayLyricScroll();
        return;
      }
      displayLyricState.raf=requestAnimationFrame(loop);
    };
    displayLyricState.raf=requestAnimationFrame(loop);
  }

  function initLyricDisplay(){
    openLyricChannel();
    document.body.innerHTML=`<div class="lyric-display-shell"><div id="lyricDisplayScreen" class="lyric-display-screen black-theme"><div id="lyricDisplayScroll" class="lyric-display-scroll"><div id="lyricDisplayText" class="lyric-display-text">Waiting for lyrics...</div></div></div></div>`;

    try{
      const raw=localStorage.getItem(LYRIC_STORAGE_KEY);
      if(raw){const saved=JSON.parse(raw);if(saved?.payload)applyLyricDisplayPayload(saved.payload);}
      window.addEventListener('storage',e=>{if(e.key===LYRIC_STORAGE_KEY&&e.newValue){try{const saved=JSON.parse(e.newValue);if(saved?.payload)applyLyricDisplayPayload(saved.payload);}catch(err){}}});
    }catch(err){}

    window.addEventListener('message',e=>{const d=e.data||{};if(!d||d.ssgLyric!==true)return;if(d.type==='state')applyLyricDisplayPayload(d.payload||{});});

    // IMPORTANT: this listener belongs ONLY to the display window.
    // The window is focused by sendLyricToPrompter(), so the user does not
    // need to click the display before shortcuts become active.
    window.addEventListener('keydown',e=>{
      if(e.repeat)return;
      const code=e.code, sc=$('lyricDisplayScroll'), t=$('lyricDisplayText');

      if(code==='Space'){
        e.preventDefault();e.stopPropagation();
        if(displayLyricState.scrolling){displayLyricState.localScrollControl=true;stopDisplayLyricScroll();}else{displayLyricState.localScrollControl=true;startDisplayLyricScroll();}
        return;
      }
      if(/^Digit[1-9]$/.test(code)){
        e.preventDefault();e.stopPropagation();
        displayLyricState.speed=Number(code.slice(-1));
        displayLyricState.localScrollControl=true;
        if(displayLyricState.scrolling){ const pos=$('lyricDisplayScroll')?.scrollTop||0; stopDisplayLyricScroll(); const sc2=$('lyricDisplayScroll'); if(sc2)sc2.scrollTop=pos; startDisplayLyricScroll(); }
        return;
      }
      if(code==='Digit0'){
        e.preventDefault();e.stopPropagation();
        displayLyricState.localScrollControl=true;
        stopDisplayLyricScroll();
        return;
      }
      if(code==='KeyP'){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        const current=Number.isFinite(Number(displayLyricState.backgroundIndex))?Number(displayLyricState.backgroundIndex):0;
        const next=(current+1)%BUILTIN_LYRIC_BACKGROUNDS.length;
        displayLyricState.backgroundIndex=next;
        displayLyricState.backgroundDataUrl=lyricBackgroundUrl(next);
        displayLyricState.backgroundName=lyricBackgroundName(next);
        const displayScreen=$('lyricDisplayScreen');
        if(displayScreen){
          displayScreen.className='lyric-display-screen '+(next===1?'blue-theme':next===2?'people-theme':next===3?'royal-theme':'black-theme');
          lyricBackgroundStyleDisplay(displayScreen,displayLyricState.backgroundDataUrl);
        }
        sendLyricDisplayBackground();
        return;
      }
      if(code==='BracketLeft'||code==='BracketRight'){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        const cur=displayLyricState.textSize||42;
        const next=code==='BracketLeft'?Math.max(22,cur-3):Math.min(168,cur+3);
        displayLyricState.textSize=next;
        if(t)t.style.fontSize=next+'px';
        return;
      }
      if(code==='Minus'&&!e.shiftKey){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        const cur=displayLyricState.lineWidth||80;
        const next=Math.max(20,cur-5);
        displayLyricState.lineWidth=next;
        if(t)t.style.maxWidth=next+'%';
        return;
      }
      if(code==='Equal'&&!e.shiftKey){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        const cur=displayLyricState.lineWidth||80;
        const next=Math.min(100,cur+5);
        displayLyricState.lineWidth=next;
        if(t)t.style.maxWidth=next+'%';
        return;
      }
      if(code==='NumpadAdd'||code==='NumpadSubtract'){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        if(sc){const delta=code==='NumpadAdd'?250:-250;const max=Math.max(0,sc.scrollHeight-sc.clientHeight);displayLyricState.scrollPosition=Math.max(0,Math.min(max,sc.scrollTop+delta));sc.scrollTop=displayLyricState.scrollPosition;}
        return;
      }
      if(code==='ArrowUp'||code==='ArrowDown'){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        if(sc){const delta=code==='ArrowDown'?100:-100;const max=Math.max(0,sc.scrollHeight-sc.clientHeight);displayLyricState.scrollPosition=Math.max(0,Math.min(max,sc.scrollTop+delta));sc.scrollTop=displayLyricState.scrollPosition;}
        return;
      }
      if(code==='KeyT'){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        if(sc){sc.scrollTop=0;displayLyricState.scrollPosition=0;}
        return;
      }
      if(code==='ArrowLeft'||code==='ArrowRight'){

        displayLyricState.localScrollControl=true;        e.preventDefault();e.stopPropagation();
        const now=performance.now();
        const same=displayLyricState.lastArrow.key===code&&(now-displayLyricState.lastArrow.time)<=400;
        displayLyricState.lastArrow={key:code,time:now};
        if(same){
          displayLyricState.lastArrow={key:'',time:0};
          const direction=code==='ArrowLeft'?'prev':'next';
          // Navigation is the only keyboard command that goes back to MAIN.
          // MAIN changes the active block and sends the new lyric state back.
          if(!sendLyricChannel('navigate',{direction:direction})){
            try{window.opener?.postMessage({ssgLyric:true,type:'navigate',direction:direction},'*');}catch(err){}
          }
        }
        return;
      }
    },true);

    window.addEventListener('beforeunload',()=>stopDisplayLyricScroll());
    sendLyricDisplayReady();
    try{window.opener?.postMessage({ssgLyric:true,type:'ready'},'*');}catch(err){}
    // Focus immediately after listeners are installed.
    setTimeout(()=>{try{window.focus();}catch(err){}},0);
  }

  function onPresenterMessage(e){
    const d=e.data||{};
    if(!d||d.ssgPresenter!==true)return;
    if(d.type==='ready'){
      if(d.mode==='display') state.displayWindow=e.source;
      if(d.mode==='control') state.controlWindow=e.source;
      sendPresenterState(e.source);
      return;
    }
    if(!markPresenterCommand(d.commandId)) return;
    if(d.type==='toggleTarget'){
      const next=(d.target==='display'||d.target==='control')
        ? d.target
        : (state.promptTarget==='control'?'display':'control');
      state.promptTarget=next;
      broadcastTarget();
      // 0 is the only keyboard command allowed to switch windows.
      // Focusing happens here, not during timer/button actions.
      focusPresenterWindow(state.promptTarget);
      return;
    }
    if(d.type==='targetState'){
      if(d.target==='display'||d.target==='control'){
        state.promptTarget=d.target;
        broadcastTarget();
      }
      return;
    }
    if(d.type==='timerUpdate' || d.type==='timerState'){
      if(state.displayWindow && !state.displayWindow.closed) state.displayWindow.postMessage({ssgPresenter:true,type:'timerState',payload:d.payload,commandId:d.commandId},'*');
      return;
    }
    if(d.type==='activeItem'){
      if(state.displayWindow && !state.displayWindow.closed) state.displayWindow.postMessage({ssgPresenter:true,type:'activeItem',payload:d.payload,commandId:d.commandId},'*');
      return;
    }
    if(d.type==='displayKey'){
      if(state.displayWindow && !state.displayWindow.closed) state.displayWindow.postMessage({ssgPresenter:true,type:'displayKey',key:d.key,commandId:d.commandId},'*');
      return;
    }
    if(d.type==='controlClosed'){ try{if(state.displayWindow&&!state.displayWindow.closed)state.displayWindow.close();}catch(err){} }
  }
  function sendPresenterState(win){
    if(!win||win.closed)return;
    win.postMessage({ssgPresenter:true,type:'targetState',target:state.promptTarget,commandId:presenterCommandId()},'*');
    if(state.guide?.id) win.postMessage({ssgPresenter:true,type:'guide',guide:state.guide},'*');
  }
  function broadcastTarget(){
    const id=presenterCommandId();
    [state.displayWindow,state.controlWindow].forEach(win=>{if(win&&!win.closed)win.postMessage({ssgPresenter:true,type:'targetState',target:state.promptTarget,commandId:id},'*');});
  }

  function renderDisplay(){
